spring.application.name=trafficsourceapi

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm_dashboard_demo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=climentos-crm
security.jwt.access-token-minutes=480
security.login.maximum-failed-attempts=5

# user override (development-only)
chat.dev-user-override-enabled=${CHAT_DEV_USER_OVERRIDE_ENABLED:false}
chat.default-dev-user-id=${CHAT_DEFAULT_DEV_USER_ID:1}

# Chat attachment upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================================================
# ONE-TO-ONE CALLS
# =========================================================

# Time allowed for an unanswered call to ring
calls.ring-timeout=PT30S


# =========================================================
# WEBRTC STUN SERVERS
# =========================================================

calls.web-rtc.stun-urls[0]=stun:stun.l.google.com:19302
calls.web-rtc.stun-urls[1]=stun:stun.cloudflare.com:3478
calls.webrtc.ice-servers[0].urls[0]=stun:stun.l.google.com:19302

# =========================================================
# WEBRTC TURN SERVER
# =========================================================

# TURN is optional for local testing, but normally required
# when users are on different or restrictive networks.

calls.web-rtc.turn-urls[0]=${CALL_TURN_URL:}
calls.web-rtc.turn-username=${CALL_TURN_USERNAME:}
calls.web-rtc.turn-credential=${CALL_TURN_CREDENTIAL:}


# =========================================================
# LIVEKIT GROUP CALLING
# =========================================================

calls.live-kit.enabled=${LIVEKIT_ENABLED:false}
calls.live-kit.url=${LIVEKIT_URL:}
calls.live-kit.api-key=${LIVEKIT_API_KEY:}
calls.live-kit.api-secret=${LIVEKIT_API_SECRET:}
calls.live-kit.token-lifetime=PT2H

calls.group.maximum-participants=25
