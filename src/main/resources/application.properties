spring.application.name=trafficsourceapi

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm_dashboard_demo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Versioned database migrations run before Hibernate schema validation.
# Version 0 baselines databases restored from Dump20260921.sql without replaying
# the historical email/calendar/call schema that the dump already contains.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true

server.port=${PORT:8080}

spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=climentos-crm
security.jwt.access-token-minutes=480
security.login.maximum-failed-attempts=5

# user override (development-only)
chat.dev-user-override-enabled=${CHAT_DEV_USER_OVERRIDE_ENABLED:false}
chat.default-dev-user-id=${CHAT_DEFAULT_DEV_USER_ID:1}

# Chat attachment upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email attachment files. Set EMAIL_STORAGE_ROOT to a Railway Volume mount in production.
email.storage-root=${EMAIL_STORAGE_ROOT:uploads/email}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =========================================================
# ONE-TO-ONE CALLS
# =========================================================

# Time allowed for an unanswered call to ring
calls.ring-timeout=PT30S


# =========================================================
# WEBRTC STUN SERVERS
# =========================================================

calls.web-rtc.stun-urls[0]=stun:stun.l.google.com:19302
calls.web-rtc.stun-urls[1]=stun:stun.cloudflare.com:3478
calls.webrtc.ice-servers[0].urls[0]=stun:stun.l.google.com:19302

# =========================================================
# WEBRTC TURN SERVER
# =========================================================

# TURN is optional for local testing, but normally required
# when users are on different or restrictive networks.

calls.web-rtc.turn-urls[0]=${CALL_TURN_URL:}
calls.web-rtc.turn-username=${CALL_TURN_USERNAME:}
calls.web-rtc.turn-credential=${CALL_TURN_CREDENTIAL:}


# =========================================================
# LIVEKIT GROUP CALLING
# =========================================================

calls.live-kit.enabled=${LIVEKIT_ENABLED:false}
calls.live-kit.url=${LIVEKIT_URL:}
calls.live-kit.api-key=${LIVEKIT_API_KEY:}
calls.live-kit.api-secret=${LIVEKIT_API_SECRET:}
calls.live-kit.token-lifetime=PT2H

calls.group.maximum-participants=25

# External email providers. Configure secrets only through environment variables.
email.token-encryption-key=${EMAIL_TOKEN_ENCRYPTION_KEY:}
email.oauth.google.client-id=${GOOGLE_EMAIL_CLIENT_ID:}
email.oauth.google.client-secret=${GOOGLE_EMAIL_CLIENT_SECRET:}
email.oauth.microsoft.client-id=${MICROSOFT_EMAIL_CLIENT_ID:}
email.oauth.microsoft.client-secret=${MICROSOFT_EMAIL_CLIENT_SECRET:}
email.oauth.microsoft.tenant=${MICROSOFT_EMAIL_TENANT:common}
email.gmail.initial-sync-limit=${GMAIL_INITIAL_SYNC_LIMIT:100}
email.gmail.sync-interval=${GMAIL_SYNC_INTERVAL:30s}
